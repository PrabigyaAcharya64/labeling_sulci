<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Convolution on a grid</title>
<style>
  :root{--blue:#1D4ED8;--orange:#C2410C;--grey:#6B7280;--rule:#E5E7EB;--ink:#1A1A1A;}
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);}
  #stage{position:absolute;top:50%;left:50%;width:900px;height:506px;transform-origin:center center;}
  text{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  .lab{font-family:Inter,system-ui,sans-serif;}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 900 506" width="900" height="506"></svg>
</div>
<script>
window.addEventListener('keydown',e=>{
  if(window.parent===window)return;
  const k=['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','Escape'];
  if(k.indexOf(e.key)<0)return; e.preventDefault();
  window.parent.postMessage({type:'deckkey',key:e.key},'*');
});
(function(){const s=document.getElementById('stage');
 function fit(){const k=Math.min(innerWidth/900,innerHeight/506);s.style.transform=`translate(-50%,-50%) scale(${k})`;}
 fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.body);})();

const B="#1D4ED8",O="#C2410C",G="#6B7280",R="#E5E7EB",K="#1A1A1A";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function tx(x,y,s,o={}){const e=el('text',{x,y,'text-anchor':o.a||'middle','font-size':o.s||14,fill:o.f||K,'font-family':o.ff||"'IBM Plex Mono',monospace"});e.textContent=s;return e;}

// data
const N=6, KS=3, OUT=N-KS+1;             // 6x6 -> 4x4
const inp=[[3,1,2,0,4,1],[0,5,1,3,2,0],[2,1,4,1,0,3],[1,0,2,5,1,2],[4,2,0,1,3,1],[0,3,1,2,0,4]];
const ker=[[1,0,1],[0,2,0],[1,0,1]];
const out=[];
for(let r=0;r<OUT;r++){out.push([]);for(let c=0;c<OUT;c++){let svv=0;for(let i=0;i<KS;i++)for(let j=0;j<KS;j++)svv+=inp[r+i][c+j]*ker[i][j];out[r].push(svv);}}

const IC=44, IX=40, IY=96;               // input grid
const OC=44, OX=628, OY=140;             // output grid
const gridCells=[];                       // input cell refs

function drawGrid(gx,gy,cell,rows,cols,vals,idPrefix){
  const cells=[];
  for(let r=0;r<rows;r++){cells.push([]);for(let c=0;c<cols;c++){
    const x=gx+c*cell,y=gy+r*cell;
    const rect=el('rect',{x,y,width:cell,height:cell,fill:'#fff',stroke:R,'stroke-width':1});
    svg.appendChild(rect);
    const t=tx(x+cell/2,y+cell/2+5, vals?vals[r][c]:'', {s:16});
    svg.appendChild(t);
    cells[r].push({rect,t,x,y});
  }}
  return cells;
}

// labels
svg.appendChild(tx(IX+N*IC/2, IY-18,'input',{ff:'Inter,sans-serif',f:B,s:17}));
svg.appendChild(tx(OX+OUT*OC/2, OY-18,'feature map',{ff:'Inter,sans-serif',f:O,s:17}));
const inCells=drawGrid(IX,IY,IC,N,N,inp);
const outCells=drawGrid(OX,OY,OC,OUT,OUT,out.map(r=>r.map(_=>'')));  // blank until computed
outCells.flat().forEach(o=>o.rect.setAttribute('fill','#fff'));

// kernel legend (bottom-left)
const KX=40,KY=396,KC=30;
svg.appendChild(tx(KX+KS*KC/2,KY-10,'kernel',{ff:'Inter,sans-serif',f:G,s:14}));
for(let i=0;i<KS;i++)for(let j=0;j<KS;j++){
  svg.appendChild(el('rect',{x:KX+j*KC,y:KY+i*KC,width:KC,height:KC,fill:'#fff',stroke:O,'stroke-width':1.5}));
  svg.appendChild(tx(KX+j*KC+KC/2,KY+i*KC+KC/2+4,ker[i][j],{s:13,f:O}));
}

// moving window + connectors + formula
const win=el('rect',{x:0,y:0,width:KS*IC,height:KS*IC,fill:'rgba(194,65,12,0.10)',stroke:O,'stroke-width':2.5});
svg.appendChild(win);
const outHi=el('rect',{x:0,y:0,width:OC,height:OC,fill:'none',stroke:O,'stroke-width':2.5});
svg.appendChild(outHi);
const arrow=el('line',{x1:0,y1:0,x2:0,y2:0,stroke:O,'stroke-width':1.5,'stroke-dasharray':'4 4'});
svg.appendChild(arrow);
const formula=tx(450,470,'',{s:17,a:'middle',f:K});
svg.appendChild(formula);
svg.appendChild(tx(450,30,'each output = weighted sum of the patch under the kernel',{ff:'Inter,sans-serif',f:G,s:16}));

let idx=0;
function show(r,c){
  win.setAttribute('x',IX+c*IC); win.setAttribute('y',IY+r*IC);
  const oc=outCells[r][c];
  outHi.setAttribute('x',oc.x); outHi.setAttribute('y',oc.y);
  // fill the output value now
  oc.t.textContent=out[r][c]; oc.rect.setAttribute('fill','rgba(194,65,12,0.10)');
  arrow.setAttribute('x1',IX+c*IC+KS*IC); arrow.setAttribute('y1',IY+r*IC+KS*IC/2);
  arrow.setAttribute('x2',oc.x); arrow.setAttribute('y2',oc.y+OC/2);
  // formula
  const parts=[];
  for(let i=0;i<KS;i++)for(let j=0;j<KS;j++){if(ker[i][j])parts.push(inp[r+i][c+j]+'×'+ker[i][j]);}
  formula.textContent=parts.join(' + ')+' = '+out[r][c];
}
function step(){
  const r=Math.floor(idx/OUT), c=idx%OUT;
  show(r,c);
  idx=(idx+1)%(OUT*OUT);
  if(idx===0){ // brief pause then clear fills for next sweep
    setTimeout(()=>{outCells.flat().forEach(o=>{o.rect.setAttribute('fill','#fff');o.t.textContent='';});},700);
  }
}
step();
setInterval(step,1100);
</script>
</body>
</html>
