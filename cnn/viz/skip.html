<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skip connections</title>
<style>
  :root{--orange:#C2410C;--grey:#6B7280;--rule:#E5E7EB;--ink:#1A1A1A;--blue:#1D4ED8;}
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);}
  #stage{position:absolute;top:50%;left:50%;width:900px;height:506px;transform-origin:center center;}
</style>
</head>
<body>
<div id="stage"><svg id="svg" viewBox="0 0 900 506" width="900" height="506"></svg></div>
<script>
window.addEventListener('keydown',e=>{
  if(window.parent===window)return;
  const k=['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','Escape'];
  if(k.indexOf(e.key)<0)return; e.preventDefault();
  window.parent.postMessage({type:'deckkey',key:e.key},'*');
});
(function(){const s=document.getElementById('stage');
 function fit(){const k=Math.min(innerWidth/900,innerHeight/506);s.style.transform=`translate(-50%,-50%) scale(${k})`;}
 fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.body);})();

const O="#C2410C",G="#6B7280",R="#E5E7EB",K="#1A1A1A",B="#1D4ED8";
const NS="http://www.w3.org/2000/svg", svg=document.getElementById('svg');
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function tx(x,y,s,o={}){const e=el('text',{x,y,'text-anchor':o.a||'middle','font-size':o.s||14,fill:o.f||K,'font-family':o.ff||"Inter,system-ui,sans-serif"});e.textContent=s;return e;}
function arrow(x1,y1,x2,y2,colour){const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,hx=x2-9*ux,hy=y2-9*uy;
  svg.appendChild(el('line',{x1,y1,x2:hx,y2:hy,stroke:colour,'stroke-width':1.6}));
  svg.appendChild(el('polygon',{points:`${x2},${y2} ${hx-4.5*uy},${hy+4.5*ux} ${hx+4.5*uy},${hy-4.5*ux}`,fill:colour}));}

// ---- shape (wavy blob) ----
function Rad(th){return 0.30+0.065*Math.cos(3*th+0.5);}
function inside(nx,ny){const dx=nx-0.5,dy=ny-0.47,r=Math.hypot(dx,dy);if(r<1e-6)return 1;return r<=Rad(Math.atan2(dy,dx))?1:0;}
function col(v){const a=[217,220,225],b=[194,65,12];return `rgb(${Math.round(a[0]+(b[0]-a[0])*v)},${Math.round(a[1]+(b[1]-a[1])*v)},${Math.round(a[2]+(b[2]-a[2])*v)})`;}
const N=16, C=4;
const hv=[]; for(let r=0;r<N;r++){hv.push([]);for(let c=0;c<N;c++)hv[r].push(inside((c+0.5)/N,(r+0.5)/N));}
const cv=[]; for(let a=0;a<C;a++){cv.push([]);for(let b=0;b<C;b++){let s=0;for(let i=0;i<4;i++)for(let j=0;j<4;j++)s+=hv[a*4+i][b*4+j];cv[a].push(s/16);}}
function bilerp(r,c){let fy=(r+0.5)/N*C-0.5,fx=(c+0.5)/N*C-0.5;fy=Math.max(0,Math.min(C-1,fy));fx=Math.max(0,Math.min(C-1,fx));
  const y0=Math.floor(fy),x0=Math.floor(fx),y1=Math.min(C-1,y0+1),x1=Math.min(C-1,x0+1),ty=fy-y0,tx2=fx-x0;
  return cv[y0][x0]*(1-tx2)*(1-ty)+cv[y0][x1]*tx2*(1-ty)+cv[y1][x0]*(1-tx2)*ty+cv[y1][x1]*tx2*ty;}

// ---- layout: input top-left, coarse mid-left, with-skip top-right, no-skip bottom-right ----
const IX=64, IY=96, IC=8;                 // input 16x16 -> 128
const CX=104, CY=286, CC=22;              // coarse 4x4 -> 88
const WSX=612, WSY=92, OC=7;              // with-skip (top)  -> 112
const NSX=612, NSY=300;                   // no-skip (bottom) -> 112

function grid(gx,gy,n,cell,valfn){
  const cells=[];
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const rect=el('rect',{x:gx+c*cell,y:gy+r*cell,width:cell+0.4,height:cell+0.4,fill:valfn(r,c),opacity:0});
    svg.appendChild(rect); cells.push(rect);
  }
  svg.appendChild(el('rect',{x:gx,y:gy,width:n*cell,height:n*cell,fill:'none',stroke:R,'stroke-width':1.2}));
  return cells;
}
const inCells=grid(IX,IY,N,IC,(r,c)=>col(hv[r][c]));
const coCells=grid(CX,CY,C,CC,(r,c)=>col(cv[r][c]));
const wsCells=grid(WSX,WSY,N,OC,(r,c)=>col(hv[r][c]));      // sharp
const nsCells=grid(NSX,NSY,N,OC,(r,c)=>col(bilerp(r,c)));   // blurry

function boundary(gx,gy){
  const cx=gx+0.5*N*OC, cy=gy+0.47*N*OC, pts=[];
  for(let i=0;i<=90;i++){const th=i/90*2*Math.PI,rr=Rad(th)*N*OC;pts.push((cx+rr*Math.cos(th)).toFixed(1)+','+(cy+rr*Math.sin(th)).toFixed(1));}
  return el('polyline',{points:pts.join(' '),fill:'none',stroke:K,'stroke-width':1.2,'stroke-dasharray':'3 3',opacity:0});
}
const wsLine=boundary(WSX,WSY), nsLine=boundary(NSX,NSY); svg.appendChild(wsLine); svg.appendChild(nsLine);

// static labels
svg.appendChild(tx(IX+N*IC/2, IY-12,'input · 16×16',{f:B,s:14}));
svg.appendChild(tx(CX+C*CC/2, CY-12,'pooled · 4×4',{f:G,s:14}));
svg.appendChild(tx(WSX+N*OC/2, WSY-12,'decoder — with skip',{f:O,s:14}));
svg.appendChild(tx(NSX+N*OC/2, NSY-12,'decoder — no skip',{f:G,s:14}));

// arrows (static structure)
arrow(IX+N*IC/2, IY+N*IC+4, CX+C*CC/2, CY-4, G);                 // pool (down)
svg.appendChild(tx(84, (IY+N*IC+CY)/2+4,'pool',{f:G,s:12,a:'end'}));
arrow(CX+C*CC+6, CY+C*CC*0.78, NSX-6, NSY+N*OC/2, G);           // upsample -> no-skip (lower)
svg.appendChild(tx(400, 372,'upsample',{f:G,s:12}));
arrow(CX+C*CC+6, CY+C*CC*0.22, WSX-6, WSY+N*OC*0.72, G);        // upsample -> with-skip (upper)
svg.appendChild(tx(372, 250,'upsample',{f:G,s:12}));

// skip arc along the top (input -> with-skip), stays clear of everything
const skipPath=el('path',{d:`M ${IX+N*IC-6},${IY+10} C 300,40 500,40 ${WSX-6},${WSY+18}`,fill:'none',stroke:O,'stroke-width':2.4});
const skipLen=640; skipPath.style.strokeDasharray=skipLen; skipPath.setAttribute('stroke-dashoffset',skipLen); svg.appendChild(skipPath);
const skipHead=el('polygon',{points:`${WSX-6},${WSY+18} ${WSX-16},${WSY+13} ${WSX-16},${WSY+23}`,fill:O,opacity:0}); svg.appendChild(skipHead);
const skipLbl=tx(400,36,'skip: copy the sharp detail across',{f:O,s:14}); skipLbl.setAttribute('opacity',0); svg.appendChild(skipLbl);

// pooling highlight
const poolHi=el('rect',{x:0,y:0,width:4*IC,height:4*IC,fill:'rgba(29,78,216,0.10)',stroke:B,'stroke-width':2,opacity:0}); svg.appendChild(poolHi);
const caption=el('text',{x:450,y:478,'text-anchor':'middle','font-size':17,fill:K,'font-family':'Inter,system-ui,sans-serif'}); svg.appendChild(caption);

const setOp=(cells,n)=>cells.forEach((e,i)=>e.setAttribute('opacity', i<n?1:0));
const L=13000, t0=performance.now();
function frame(){
  requestAnimationFrame(frame);
  const t=(performance.now()-t0)%L;
  inCells.forEach(e=>e.setAttribute('opacity',Math.min(1,t/1400)));
  if(t<2400){setOp(coCells,0);setOp(nsCells,0);setOp(wsCells,0);poolHi.setAttribute('opacity',0);
    skipPath.setAttribute('stroke-dashoffset',skipLen);skipHead.setAttribute('opacity',0);skipLbl.setAttribute('opacity',0);
    nsLine.setAttribute('opacity',0);wsLine.setAttribute('opacity',0);
    caption.textContent='a sharp shape — every edge is crisp';}
  else if(t<4800){const p=(t-2400)/2400,k=Math.floor(p*16);setOp(coCells,k+1);
    poolHi.setAttribute('opacity',1);poolHi.setAttribute('x',IX+(k%4)*4*IC);poolHi.setAttribute('y',IY+Math.floor(k/4)*4*IC);
    caption.textContent='encoder pools 16×16 → 4×4 — the boundary is lost';}
  else if(t<7300){setOp(coCells,16);poolHi.setAttribute('opacity',0);const p=(t-4800)/2500;
    setOp(nsCells,Math.floor(p*256));nsLine.setAttribute('opacity',Math.min(1,p*2));
    caption.textContent='upsampling the coarse map alone → blurry, smeared edges';}
  else if(t<8500){setOp(nsCells,256);nsLine.setAttribute('opacity',1);const p=(t-7300)/1000;
    skipPath.setAttribute('stroke-dashoffset',skipLen*(1-Math.min(1,p)));skipLbl.setAttribute('opacity',Math.min(1,p*1.5));
    if(p>0.92)skipHead.setAttribute('opacity',1);
    caption.textContent='skip connection: copy the encoder’s sharp map across';}
  else if(t<11000){skipPath.setAttribute('stroke-dashoffset',0);skipHead.setAttribute('opacity',1);skipLbl.setAttribute('opacity',1);
    const p=(t-8500)/2500;setOp(wsCells,Math.floor(p*256));wsLine.setAttribute('opacity',Math.min(1,p*2));
    caption.textContent='with the skip, the boundary is crisp and correctly placed';}
  else{setOp(coCells,16);setOp(nsCells,256);setOp(wsCells,256);nsLine.setAttribute('opacity',1);wsLine.setAttribute('opacity',1);
    skipPath.setAttribute('stroke-dashoffset',0);skipHead.setAttribute('opacity',1);skipLbl.setAttribute('opacity',1);poolHi.setAttribute('opacity',0);
    caption.textContent='top = with skip (sharp)     ·     bottom = no skip (blurry)';}
}
frame();
</script>
</body>
</html>
