<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Padding</title>
<style>
  :root{--orange:#C2410C;--grey:#6B7280;--rule:#E5E7EB;--ink:#1A1A1A;--blue:#1D4ED8;}
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);}
  #stage{position:absolute;top:50%;left:50%;width:900px;height:506px;transform-origin:center center;}
</style>
</head>
<body>
<div id="stage"><svg id="svg" viewBox="0 0 900 506" width="900" height="506"></svg></div>
<script>
window.addEventListener('keydown',e=>{
  if(window.parent===window)return;
  const k=['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','Escape'];
  if(k.indexOf(e.key)<0)return; e.preventDefault();
  window.parent.postMessage({type:'deckkey',key:e.key},'*');
});
// P pauses / resumes this animation (rAF, setInterval and setTimeout)
(function(){
  var paused=false, mark=0, off=0;
  var rawNow=performance.now.bind(performance);
  performance.now=function(){return (paused?mark:rawNow())-off;};
  var RAF=window.requestAnimationFrame.bind(window), held=[];
  window.requestAnimationFrame=function(cb){ if(paused){held.push(cb);return 0;} return RAF(cb); };
  var SI=window.setInterval.bind(window), CI=window.clearInterval.bind(window), ivs=[];
  window.setInterval=function(cb,d){ var r={cb:cb,d:d,id:null}; r.id=SI(cb,d); ivs.push(r); return r.id; };
  window.clearInterval=function(id){ CI(id); for(var i=ivs.length-1;i>=0;i--) if(ivs[i].id===id) ivs.splice(i,1); };
  var ST=window.setTimeout.bind(window), CT=window.clearTimeout.bind(window), tos=[];
  function sched(r){ r.start=rawNow(); r.id=ST(function(){ var i=tos.indexOf(r); if(i>=0)tos.splice(i,1); r.cb(); }, r.rem); return r.id; }
  window.setTimeout=function(cb,d){ var r={cb:cb,rem:d||0,start:0,id:null}; sched(r); tos.push(r); return r.id; };
  window.clearTimeout=function(id){ CT(id); for(var i=tos.length-1;i>=0;i--) if(tos[i].id===id) tos.splice(i,1); };
  function toggle(){
    if(!paused){ paused=true; mark=rawNow();
      ivs.forEach(function(r){ if(r.id!=null){CI(r.id); r.id=null;} });
      tos.forEach(function(r){ r.rem=Math.max(0, r.rem-(rawNow()-r.start)); CT(r.id); r.id=null; });
    } else { paused=false; off+=rawNow()-mark;
      ivs.forEach(function(r){ if(r.id==null){ r.id=SI(r.cb,r.d); } });
      tos.forEach(function(r){ sched(r); });
      var h=held; held=[]; h.forEach(function(cb){ RAF(cb); });
    }
  }
  window.addEventListener('keydown',function(e){ if(e.key==='p'||e.key==='P'){ e.preventDefault(); toggle(); } });
  window.addEventListener('message',function(e){ if(e.data&&e.data.type==='toggle-pause'){ toggle(); } });
})();
(function(){const s=document.getElementById('stage');
 function fit(){const k=Math.min(innerWidth/900,innerHeight/506);s.style.transform=`translate(-50%,-50%) scale(${k})`;}
 fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.body);})();

const O="#C2410C",G="#6B7280",R="#E5E7EB",K="#1A1A1A",B="#1D4ED8";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function tx(x,y,s,o={}){const e=el('text',{x,y,'text-anchor':o.a||'middle','font-size':o.s||14,fill:o.f||K,'font-family':o.ff||"'IBM Plex Mono',monospace"});e.textContent=s;return e;}

const IN=5, PAD=1, PN=IN+2*PAD, CELL=42, IX=70, IY=130;
const interior=[[3,1,4,0,2],[1,5,2,3,1],[4,0,6,1,3],[2,3,1,4,0],[0,2,5,1,3]];
const pad=[];for(let r=0;r<PN;r++){pad.push([]);for(let c=0;c<PN;c++){
  const inside=(r>=PAD&&r<PAD+IN&&c>=PAD&&c<PAD+IN);
  pad[r].push(inside?interior[r-PAD][c-PAD]:0);
}}
const ker=[[1,0,1],[0,1,0],[1,0,1]];
const OUTN=PN-2;
const out=[];for(let r=0;r<OUTN;r++){out.push([]);for(let c=0;c<OUTN;c++){let sm=0;for(let i=0;i<3;i++)for(let j=0;j<3;j++)sm+=pad[r+i][c+j]*ker[i][j];out[r].push(sm);}}

const OC=42, OX=568, OY=IY+CELL;
svg.appendChild(tx(450,54,'a ring of zeros lets the kernel sit on the edge pixels — so the output stays the same size',{ff:'Inter,sans-serif',f:G,s:16}));
svg.appendChild(tx(IX+PN*CELL/2, IY-16,'input + zero padding',{ff:'Inter,sans-serif',f:B,s:16}));
svg.appendChild(tx(OX+OUTN*OC/2, OY-16,'feature map — same 5×5',{ff:'Inter,sans-serif',f:O,s:16}));

for(let r=0;r<PN;r++)for(let c=0;c<PN;c++){
  const x=IX+c*CELL,y=IY+r*CELL, border=(r<PAD||r>=PAD+IN||c<PAD||c>=PAD+IN);
  svg.appendChild(el('rect',{x,y,width:CELL,height:CELL,fill:border?'#F3F4F6':'#fff',stroke:R,'stroke-width':1}));
  svg.appendChild(tx(x+CELL/2,y+CELL/2+5,pad[r][c],{s:15,f:border?G:K}));
}
const outCells=[];
for(let r=0;r<OUTN;r++){outCells.push([]);for(let c=0;c<OUTN;c++){
  const x=OX+c*OC,y=OY+r*OC;
  const rect=el('rect',{x,y,width:OC,height:OC,fill:'#fff',stroke:R,'stroke-width':1});svg.appendChild(rect);
  const t=tx(x+OC/2,y+OC/2+5,'',{s:15,f:O});svg.appendChild(t);
  outCells[r].push({rect,t,x,y});
}}
const win=el('rect',{x:0,y:0,width:3*CELL,height:3*CELL,fill:'rgba(194,65,12,0.10)',stroke:O,'stroke-width':2.5});svg.appendChild(win);
const oRing=el('rect',{x:0,y:0,width:OC,height:OC,fill:'none',stroke:O,'stroke-width':2.5});svg.appendChild(oRing);
svg.appendChild(tx(IX+PN*CELL/2, IY+PN*CELL+30,'grey border = zeros',{ff:'Inter,sans-serif',f:G,s:14}));

let idx=0;
function step(){
  const r=Math.floor(idx/OUTN), c=idx%OUTN;
  win.setAttribute('x',IX+c*CELL);win.setAttribute('y',IY+r*CELL);
  const oc=outCells[r][c];oc.t.textContent=out[r][c];oc.rect.setAttribute('fill','rgba(194,65,12,0.10)');
  oRing.setAttribute('x',oc.x);oRing.setAttribute('y',oc.y);
  idx=(idx+1)%(OUTN*OUTN);
  if(idx===0)setTimeout(()=>outCells.flat().forEach(o=>{o.rect.setAttribute('fill','#fff');o.t.textContent='';}),700);
}
step();setInterval(step,780);
</script>
</body>
</html>
