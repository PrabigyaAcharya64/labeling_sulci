<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Padding and the full flow</title>
<style>
  :root{--orange:#C2410C;--grey:#6B7280;--rule:#E5E7EB;--ink:#1A1A1A;--blue:#1D4ED8;}
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);}
  #stage{position:absolute;top:50%;left:50%;width:900px;height:506px;transform-origin:center center;}
</style>
</head>
<body>
<div id="stage"><svg id="svg" viewBox="0 0 900 506" width="900" height="506"></svg></div>
<script>
window.addEventListener('keydown',e=>{
  if(window.parent===window)return;
  const k=['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','Escape'];
  if(k.indexOf(e.key)<0)return; e.preventDefault();
  window.parent.postMessage({type:'deckkey',key:e.key},'*');
});
(function(){const s=document.getElementById('stage');
 function fit(){const k=Math.min(innerWidth/900,innerHeight/506);s.style.transform=`translate(-50%,-50%) scale(${k})`;}
 fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.body);})();

const O="#C2410C",G="#6B7280",R="#E5E7EB",K="#1A1A1A",B="#1D4ED8";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function tx(x,y,s,o={}){const e=el('text',{x,y,'text-anchor':o.a||'middle','font-size':o.s||14,fill:o.f||K,'font-family':o.ff||"Inter,system-ui,sans-serif"});e.textContent=s;return e;}

// ---------- TOP: padding + convolution keeping size ----------
const IN=5, PAD=1, PN=IN+2*PAD, CELL=30, IX=70, IY=96;
const interior=[[3,1,4,0,2],[1,5,2,3,1],[4,0,6,1,3],[2,3,1,4,0],[0,2,5,1,3]];
const pad=[]; for(let r=0;r<PN;r++){pad.push([]);for(let c=0;c<PN;c++){
  const inside=(r>=PAD&&r<PAD+IN&&c>=PAD&&c<PAD+IN);
  pad[r].push(inside?interior[r-PAD][c-PAD]:0);
}}
const ker=[[1,0,1],[0,1,0],[1,0,1]];
const OUTN=PN-2;                         // = IN (same size)
const out=[];for(let r=0;r<OUTN;r++){out.push([]);for(let c=0;c<OUTN;c++){let sm=0;for(let i=0;i<3;i++)for(let j=0;j<3;j++)sm+=pad[r+i][c+j]*ker[i][j];out[r].push(sm);}}

svg.appendChild(tx(IX+PN*CELL/2, IY-16,'input + zero padding',{f:B,s:15}));
const OX=560, OY=IY+CELL;                // output aligned to interior rows
svg.appendChild(tx(OX+OUTN*CELL/2, OY-16,'feature map — same size',{f:O,s:15}));

const inCells=[];
for(let r=0;r<PN;r++){inCells.push([]);for(let c=0;c<PN;c++){
  const x=IX+c*CELL,y=IY+r*CELL, border=(r<PAD||r>=PAD+IN||c<PAD||c>=PAD+IN);
  const rect=el('rect',{x,y,width:CELL,height:CELL,fill:border?'#F3F4F6':'#fff',stroke:R,'stroke-width':1});svg.appendChild(rect);
  const t=tx(x+CELL/2,y+CELL/2+4,pad[r][c],{s:12.5,f:border?G:K,ff:"'IBM Plex Mono',monospace"});svg.appendChild(t);
  inCells[r].push({x,y});
}}
const outCells=[];
for(let r=0;r<OUTN;r++){outCells.push([]);for(let c=0;c<OUTN;c++){
  const x=OX+c*CELL,y=OY+r*CELL;
  const rect=el('rect',{x,y,width:CELL,height:CELL,fill:'#fff',stroke:R,'stroke-width':1});svg.appendChild(rect);
  const t=tx(x+CELL/2,y+CELL/2+4,'',{s:12.5,f:O,ff:"'IBM Plex Mono',monospace"});svg.appendChild(t);
  outCells[r].push({rect,t,x,y});
}}
const win=el('rect',{x:0,y:0,width:3*CELL,height:3*CELL,fill:'rgba(194,65,12,0.10)',stroke:O,'stroke-width':2.5});svg.appendChild(win);
const oRing=el('rect',{x:0,y:0,width:CELL,height:CELL,fill:'none',stroke:O,'stroke-width':2.5});svg.appendChild(oRing);
svg.appendChild(tx(450,44,'a ring of zeros lets the kernel reach the edges — output stays the same size',{f:G,s:15}));

let idx=0;
function step(){
  const r=Math.floor(idx/OUTN), c=idx%OUTN;
  win.setAttribute('x',IX+c*CELL);win.setAttribute('y',IY+r*CELL);
  const oc=outCells[r][c];oc.t.textContent=out[r][c];oc.rect.setAttribute('fill','rgba(194,65,12,0.10)');
  oRing.setAttribute('x',oc.x);oRing.setAttribute('y',oc.y);
  idx=(idx+1)%(OUTN*OUTN);
  if(idx===0)setTimeout(()=>outCells.flat().forEach(o=>{o.rect.setAttribute('fill','#fff');o.t.textContent='';}),600);
}
step();setInterval(step,650);

// ---------- BOTTOM: the whole pipeline with feature-map stacks ----------
const PY=372;
function stack(cx,w,h,depth,color,gap){        // offset rects suggest channels
  const g=el('g',{});
  for(let d=depth-1;d>=0;d--){
    g.appendChild(el('rect',{x:cx-w/2+d*gap,y:PY-h/2-d*gap,width:w,height:h,fill:'#fff',stroke:color,'stroke-width':1.5}));
  }
  svg.appendChild(g);
}
function arrow(x1,x2){svg.appendChild(el('line',{x1,y1:PY,x2:x2-8,y2:PY,stroke:G,'stroke-width':1.4}));
  svg.appendChild(el('polygon',{points:`${x2},${PY} ${x2-8},${PY-4} ${x2-8},${PY+4}`,fill:G}));}
function lab(cx,t){svg.appendChild(tx(cx,PY+62,t,{f:G,s:12.5}));}

svg.appendChild(tx(450,318,'the whole flow — maps get smaller and deeper, then classify',{f:G,s:15}));
// input
svg.appendChild(el('rect',{x:60,y:PY-34,width:44,height:68,fill:'#fff',stroke:B,'stroke-width':1.5}));
lab(82,'input'); arrow(112,150);
stack(190,40,56,4,O,5); lab(196,'conv · maps'); arrow(250,286);
stack(320,30,42,4,G,5); lab(324,'pool'); arrow(372,410);
stack(452,24,34,8,O,4); lab(456,'conv'); arrow(500,536);
stack(572,18,26,8,G,4); lab(574,'pool'); arrow(614,650);
// flatten = tall thin bar
svg.appendChild(el('rect',{x:664,y:PY-46,width:12,height:92,fill:'#fff',stroke:G,'stroke-width':1.5}));
lab(670,'flatten'); arrow(690,724);
// dense dots
for(let i=0;i<5;i++)svg.appendChild(el('circle',{cx:740,cy:PY-32+i*16,r:4,fill:'#fff',stroke:K,'stroke-width':1.4}));
lab(740,'dense'); arrow(760,792);
// output bars
[26,40,16].forEach((w,i)=>svg.appendChild(el('rect',{x:800,y:PY-20+i*16,width:w,height:10,fill:i===1?O:'#D9DCE1'})));
lab(820,'scores');
</script>
</body>
</html>
