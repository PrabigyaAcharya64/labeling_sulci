<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mesh gradient</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;}
  body{font-family:Inter,system-ui,sans-serif;color:#1A1A1A;}
  #stage{position:absolute;top:50%;left:50%;width:900px;height:506px;transform-origin:center center;}
</style>
</head>
<body>
<div id="stage"><svg id="svg" viewBox="0 0 900 506" width="900" height="506"></svg></div>
<script>
window.addEventListener('keydown',e=>{if(window.parent===window)return;const k=['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','Escape'];if(k.indexOf(e.key)<0)return;e.preventDefault();window.parent.postMessage({type:'deckkey',key:e.key},'*');});
// P pauses / resumes this animation (rAF, setInterval and setTimeout)
(function(){
  var paused=false, mark=0, off=0;
  var rawNow=performance.now.bind(performance);
  performance.now=function(){return (paused?mark:rawNow())-off;};
  var RAF=window.requestAnimationFrame.bind(window), held=[];
  window.requestAnimationFrame=function(cb){ if(paused){held.push(cb);return 0;} return RAF(cb); };
  var SI=window.setInterval.bind(window), CI=window.clearInterval.bind(window), ivs=[];
  window.setInterval=function(cb,d){ var r={cb:cb,d:d,id:null}; r.id=SI(cb,d); ivs.push(r); return r.id; };
  window.clearInterval=function(id){ CI(id); for(var i=ivs.length-1;i>=0;i--) if(ivs[i].id===id) ivs.splice(i,1); };
  var ST=window.setTimeout.bind(window), CT=window.clearTimeout.bind(window), tos=[];
  function sched(r){ r.start=rawNow(); r.id=ST(function(){ var i=tos.indexOf(r); if(i>=0)tos.splice(i,1); r.cb(); }, r.rem); return r.id; }
  window.setTimeout=function(cb,d){ var r={cb:cb,rem:d||0,start:0,id:null}; sched(r); tos.push(r); return r.id; };
  window.clearTimeout=function(id){ CT(id); for(var i=tos.length-1;i>=0;i--) if(tos[i].id===id) tos.splice(i,1); };
  function toggle(){
    if(!paused){ paused=true; mark=rawNow();
      ivs.forEach(function(r){ if(r.id!=null){CI(r.id); r.id=null;} });
      tos.forEach(function(r){ r.rem=Math.max(0, r.rem-(rawNow()-r.start)); CT(r.id); r.id=null; });
    } else { paused=false; off+=rawNow()-mark;
      ivs.forEach(function(r){ if(r.id==null){ r.id=SI(r.cb,r.d); } });
      tos.forEach(function(r){ sched(r); });
      var h=held; held=[]; h.forEach(function(cb){ RAF(cb); });
    }
  }
  window.addEventListener('keydown',function(e){ if(e.key==='p'||e.key==='P'){ e.preventDefault(); toggle(); } });
  window.addEventListener('message',function(e){ if(e.data&&e.data.type==='toggle-pause'){ toggle(); } });
})();
(function(){const s=document.getElementById('stage');function fit(){const k=Math.min(innerWidth/900,innerHeight/506);s.style.transform=`translate(-50%,-50%) scale(${k})`;}fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.body);})();
const O="#C2410C",G="#6B7280",R="#E5E7EB",K="#1A1A1A",B="#1D4ED8",NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function tx(x,y,s,o={}){const e=el('text',{x,y,'text-anchor':o.a||'middle','font-size':o.s||14,fill:o.f||K,'font-family':o.ff||"Inter,system-ui,sans-serif"});e.textContent=s;return e;}
const CX=330,CY=258,Rax=150;
// axes
svg.appendChild(el('line',{x1:CX-Rax-14,y1:CY,x2:CX+Rax+14,y2:CY,stroke:G,'stroke-width':1.4}));
svg.appendChild(el('line',{x1:CX,y1:CY+Rax+14,x2:CX,y2:CY-Rax-14,stroke:G,'stroke-width':1.4}));
svg.appendChild(tx(CX+Rax+30,CY+5,'E',{f:G,s:14})); svg.appendChild(tx(CX-Rax-30,CY+5,'W',{f:G,s:14}));
svg.appendChild(tx(CX,CY-Rax-24,'N',{f:G,s:14})); svg.appendChild(tx(CX,CY+Rax+32,'S',{f:G,s:14}));
svg.appendChild(el('circle',{cx:CX,cy:CY,r:4,fill:K}));
svg.appendChild(tx(450,40,'the surface gradient, split into east–west and north–south',{f:G,s:16}));
// dynamic
const grad=el('line',{x1:CX,y1:CY,x2:CX,y2:CY,stroke:B,'stroke-width':3}); svg.appendChild(grad);
const gh=el('polygon',{points:'0,0 0,0 0,0',fill:B}); svg.appendChild(gh);
const ewBar=el('line',{x1:CX,y1:CY,x2:CX,y2:CY,stroke:O,'stroke-width':4}); svg.appendChild(ewBar);
const nsBar=el('line',{x1:CX,y1:CY,x2:CX,y2:CY,stroke:O,'stroke-width':4}); svg.appendChild(nsBar);
const dEW=el('line',{x1:0,y1:0,x2:0,y2:0,stroke:G,'stroke-width':0.8,'stroke-dasharray':'4 4'}); svg.appendChild(dEW);
const dNS=el('line',{x1:0,y1:0,x2:0,y2:0,stroke:G,'stroke-width':0.8,'stroke-dasharray':'4 4'}); svg.appendChild(dNS);
const glab=tx(0,0,'∇f',{f:B,s:15}); svg.appendChild(glab);
// readouts
svg.appendChild(el('rect',{x:610,y:170,width:230,height:120,rx:4,fill:'none',stroke:R,'stroke-width':1.2}));
const rEW=tx(625,220,'',{a:'start',s:22,ff:"'IBM Plex Mono',monospace",f:O}); svg.appendChild(rEW);
const rNS=tx(625,262,'',{a:'start',s:22,ff:"'IBM Plex Mono',monospace",f:O}); svg.appendChild(rNS);
svg.appendChild(tx(725,150,'components',{f:G,s:14}));
const mag=Rax*0.95, t0=performance.now();
function frame(){requestAnimationFrame(frame);
  const t=(performance.now()-t0)/1000;
  const ang=0.6*Math.sin(t*0.5)+ -0.9;                 // sweeps around NE
  const tipx=CX+mag*Math.cos(ang), tipy=CY+mag*Math.sin(ang);
  grad.setAttribute('x2',tipx); grad.setAttribute('y2',tipy);
  const ux=Math.cos(ang),uy=Math.sin(ang),hx=tipx-12*ux,hy=tipy-12*uy;
  gh.setAttribute('points',`${tipx},${tipy} ${hx-5*uy},${hy+5*ux} ${hx+5*uy},${hy-5*ux}`);
  ewBar.setAttribute('x2',tipx); ewBar.setAttribute('y2',CY);
  nsBar.setAttribute('x2',CX); nsBar.setAttribute('y2',tipy);
  dEW.setAttribute('x1',tipx);dEW.setAttribute('y1',tipy);dEW.setAttribute('x2',tipx);dEW.setAttribute('y2',CY);
  dNS.setAttribute('x1',tipx);dNS.setAttribute('y1',tipy);dNS.setAttribute('x2',CX);dNS.setAttribute('y2',tipy);
  glab.setAttribute('x',tipx+ (ux>=0?16:-16)); glab.setAttribute('y',tipy-8);
  rEW.textContent='∇EW = '+(Math.cos(ang)).toFixed(2);
  rNS.textContent='∇NS = '+(-Math.sin(ang)).toFixed(2);
}
frame();
</script>
</body>
</html>
