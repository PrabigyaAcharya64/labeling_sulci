<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Convolution on a sphere</title>
<style>
  :root{--orange:#C2410C;--grey:#6B7280;--rule:#E5E7EB;--ink:#1A1A1A;--blue:#1D4ED8;}
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);}
  #stage{position:absolute;top:50%;left:50%;width:900px;height:506px;transform-origin:center center;}
</style>
</head>
<body>
<div id="stage"><svg id="svg" viewBox="0 0 900 506" width="900" height="506"></svg></div>
<script>
window.addEventListener('keydown',e=>{
  if(window.parent===window)return;
  const k=['ArrowRight','ArrowLeft','ArrowUp','ArrowDown',' ','Escape'];
  if(k.indexOf(e.key)<0)return; e.preventDefault();
  window.parent.postMessage({type:'deckkey',key:e.key},'*');
});
(function(){const s=document.getElementById('stage');
 function fit(){const k=Math.min(innerWidth/900,innerHeight/506);s.style.transform=`translate(-50%,-50%) scale(${k})`;}
 fit();addEventListener('resize',fit);new ResizeObserver(fit).observe(document.body);})();

const O="#C2410C",G="#6B7280",R="#E5E7EB",K="#1A1A1A",B="#1D4ED8";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function tx(x,y,s,o={}){const e=el('text',{x,y,'text-anchor':o.a||'middle','font-size':o.s||14,fill:o.f||K,'font-family':o.ff||"Inter,system-ui,sans-serif"});e.textContent=s;return e;}

// triangular lattice clipped to a disc -> each interior vertex has 6 neighbours
function lattice(cx,cy,Rc){
  const dx=42, dy=dx*Math.sqrt(3)/2, pts=[];
  for(let j=-5;j<=5;j++){for(let i=-6;i<=6;i++){
    const x=cx+i*dx+(j&1?dx/2:0), y=cy+j*dy;
    if(Math.hypot(x-cx,y-cy)<=Rc) pts.push({x,y});
  }}
  const adj=pts.map(()=>[]);
  for(let a=0;a<pts.length;a++)for(let b=a+1;b<pts.length;b++){
    if(Math.hypot(pts[a].x-pts[b].x,pts[a].y-pts[b].y)<dx*1.15){adj[a].push(b);adj[b].push(a);}
  }
  return {pts,adj};
}

const Rc=150, LCX=238, RCX=662, CY=268;
function sphere(cx){                       // sphere silhouette + a little shading
  svg.appendChild(el('circle',{cx,cy:CY,r:Rc,fill:'#FAFAFA',stroke:R,'stroke-width':1.5}));
  svg.appendChild(el('ellipse',{cx,cy:CY,rx:Rc*0.45,ry:Rc,fill:'none',stroke:R,'stroke-width':1}));
  svg.appendChild(el('ellipse',{cx,cy:CY,rx:Rc,ry:Rc*0.42,fill:'none',stroke:R,'stroke-width':1}));
}
sphere(LCX); sphere(RCX);
const Lin=lattice(LCX,CY,Rc-10), Rout=lattice(RCX,CY,Rc-10);

function drawMesh(m,edgeColor){
  const eg=el('g',{});
  for(let a=0;a<m.pts.length;a++)for(const b of m.adj[a])if(b>a)
    eg.appendChild(el('line',{x1:m.pts[a].x,y1:m.pts[a].y,x2:m.pts[b].x,y2:m.pts[b].y,stroke:edgeColor,'stroke-width':1}));
  svg.appendChild(eg);
  const dg=el('g',{});
  const dots=m.pts.map(p=>{const c=el('circle',{cx:p.x,cy:p.y,r:3,fill:'#C9CDD3'});dg.appendChild(c);return c;});
  svg.appendChild(dg);
  return dots;
}
const Ldots=drawMesh(Lin,'#EEF0F2');
const Rdots=drawMesh(Rout,'#EEF0F2');

// interior vertices (6 neighbours) to sweep as patch centres
const centres=[];
for(let i=0;i<Lin.pts.length;i++) if(Lin.adj[i].length===6) centres.push(i);

// highlight layer for the patch
const patchG=el('g',{}); svg.appendChild(patchG);
const outDot=el('circle',{cx:0,cy:0,r:0,fill:O}); svg.appendChild(outDot);

svg.appendChild(tx(LCX,CY-Rc-22,'input surface',{f:B,s:17}));
svg.appendChild(tx(RCX,CY-Rc-22,'feature map',{f:O,s:17}));
svg.appendChild(tx(450,40,'no square window fits a sphere — each vertex mixes its own neighbours',{f:G,s:16}));
svg.appendChild(tx(450,478,'out(v) = w₀·v + Σ wᵢ · neighbourᵢ   —   one centre + 6 neighbours',{f:K,s:16,ff:"'IBM Plex Mono',monospace"}));
// arrow between spheres
svg.appendChild(el('line',{x1:LCX+Rc+14,y1:CY,x2:RCX-Rc-14,y2:CY,stroke:G,'stroke-width':1.5}));
svg.appendChild(el('polygon',{points:`${RCX-Rc-14},${CY} ${RCX-Rc-24},${CY-4} ${RCX-Rc-24},${CY+4}`,fill:G}));

let idx=0;
function step(){
  patchG.innerHTML='';
  const ci=centres[idx%centres.length];
  const c=Lin.pts[ci], nb=Lin.adj[ci];
  // edges centre->neighbour
  for(const b of nb) patchG.appendChild(el('line',{x1:c.x,y1:c.y,x2:Lin.pts[b].x,y2:Lin.pts[b].y,stroke:O,'stroke-width':2}));
  // neighbour rings
  for(const b of nb) patchG.appendChild(el('circle',{cx:Lin.pts[b].x,cy:Lin.pts[b].y,r:6,fill:'none',stroke:O,'stroke-width':2}));
  // centre
  patchG.appendChild(el('circle',{cx:c.x,cy:c.y,r:6.5,fill:O}));
  // fill corresponding output vertex
  const rc=Rout.pts[ci];
  outDot.setAttribute('cx',rc.x); outDot.setAttribute('cy',rc.y); outDot.setAttribute('r',6.5);
  Rdots[ci].setAttribute('fill',O); Rdots[ci].setAttribute('r',5);
  idx++;
  if(idx%centres.length===0) setTimeout(()=>Rdots.forEach(d=>{d.setAttribute('fill','#C9CDD3');d.setAttribute('r',3);}),700);
}
step(); setInterval(step,950);
</script>
</body>
</html>
