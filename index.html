<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{ --ink:#1A1A1A; --muted:#9AA0A8; --rule:#ECEEF1; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; }
    body{
      background:#fff; color:var(--ink);
      font-family:'Inter', system-ui, -apple-system, sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:48px 24px;
    }
    .grid{
      display:grid; grid-template-columns:repeat(2, minmax(0,360px));
      gap:44px; width:100%; max-width:820px;
    }
    .card{ text-decoration:none; color:inherit; display:block; }
    .thumb{
      width:100%; aspect-ratio:3/2; object-fit:cover; display:block;
      background:#fff; border:1px solid var(--rule); border-radius:14px;
      box-shadow:0 1px 2px rgba(16,24,40,.04);
      transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .card:hover .thumb{
      transform:translateY(-5px);
      box-shadow:0 14px 34px rgba(16,24,40,.10);
      border-color:#DfE3E8;
    }
    .meta{ margin-top:16px; }
    .idx{ font-size:12px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
    .name{ font-size:16px; font-weight:500; margin-top:3px; }
    @media (max-width:640px){ .grid{ grid-template-columns:1fr; max-width:380px; } }
  </style>
</head>
<body>
  <div class="grid">
    <a class="card" href="introduction/">
      <img class="thumb" src="thumbnails/introduction.png" alt="Introduction">
      <div class="meta">
        <div class="idx">Presentation 01</div>
        <div class="name">Introduction</div>
      </div>
    </a>
    <a class="card" href="cnn/">
      <img class="thumb" src="thumbnails/cnn.png" alt="Convolutional Neural Networks">
      <div class="meta">
        <div class="idx">Presentation 02</div>
        <div class="name">Convolutional Neural Networks</div>
      </div>
    </a>
  </div>
</body>
</html>
