<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The mesh</title>
<style>
  :root { --blue:#1D4ED8; --grey:#6B7280; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#fff; overflow:hidden; }
  body {
    display:flex; flex-direction:column; align-items:center;
    font-family: Inter, system-ui, -apple-system, sans-serif; color:#1A1A1A;
  }
  #host { flex:1 1 auto; width:100%; min-height:0; position:relative; }
  #host canvas { display:block; }
  .counts {
    flex:0 0 auto;
    font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    font-size:13px; color:var(--grey); padding:10px 0 14px;
  }
</style>
</head>
<body>
<div id="host"></div>
<div class="counts" id="counts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Forward deck navigation keys to the parent: once focus is inside this iframe
// reveal.js stops receiving them, which makes the arrow keys appear stuck.
window.addEventListener('keydown', function (e) {
  if (window.parent === window) return;
  const keys = ['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', ' ', 'Escape'];
  if (keys.indexOf(e.key) === -1) return;
  e.preventDefault();
  window.parent.postMessage({ type: 'deckkey', key: e.key }, '*');
});

// ---------------------------------------------------------------------------
// geodesic icosphere, built by hand with a midpoint cache so shared edges are
// welded. THREE.IcosahedronGeometry does not weld and gives the wrong counts.
// vertices follow 10*4^n + 2, faces 20*4^n.
// ---------------------------------------------------------------------------
function buildIcosphere(order) {
  const t = (1 + Math.sqrt(5)) / 2;
  let verts = [
    [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
    [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
    [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]
  ].map(v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; });

  let faces = [
    [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
    [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
  ];

  for (let s = 0; s < order; s++) {
    const cache = new Map();
    const next = [];
    const mid = (a, b) => {
      const key = a < b ? a * 1000000 + b : b * 1000000 + a;
      const hit = cache.get(key);
      if (hit !== undefined) return hit;
      const va = verts[a], vb = verts[b];
      let m = [(va[0] + vb[0]) / 2, (va[1] + vb[1]) / 2, (va[2] + vb[2]) / 2];
      const l = Math.hypot(m[0], m[1], m[2]);
      m = [m[0] / l, m[1] / l, m[2] / l];
      const idx = verts.length;
      verts.push(m);
      cache.set(key, idx);
      return idx;
    };
    for (const [a, b, c] of faces) {
      const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
      next.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
    }
    faces = next;
  }
  return { verts, faces };
}

const ORDER = 5;
const { verts, faces } = buildIcosphere(ORDER);   // 10242 verts, 20480 faces

document.getElementById('counts').textContent =
  verts.length.toLocaleString() + ' vertices · ' + faces.length.toLocaleString() + ' triangles';

// ---------------------------------------------------------------------------
// ridged noise. Directional sine octaves band into parallel scallops, so this
// uses isotropic value noise instead, ridged with 1-|2n-1| and summed as fBm.
// ---------------------------------------------------------------------------
function hash3(i, j, k) {
  let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

const smooth = t => t * t * (3 - 2 * t);

function vnoise(x, y, z) {
  const i = Math.floor(x), j = Math.floor(y), k = Math.floor(z);
  const fx = smooth(x - i), fy = smooth(y - j), fz = smooth(z - k);
  let n = 0;
  for (let dz = 0; dz < 2; dz++)
    for (let dy = 0; dy < 2; dy++)
      for (let dx = 0; dx < 2; dx++)
        n += (dx ? fx : 1 - fx) * (dy ? fy : 1 - fy) * (dz ? fz : 1 - fz)
           * hash3(i + dx, j + dy, k + dz);
  return n;
}

function ridged(x, y, z) {
  let sum = 0, amp = 1, norm = 0, f = 3.0;
  for (let o = 0; o < 4; o++) {
    const n = vnoise(x * f + 13.3, y * f + 7.1, z * f + 21.7);
    sum += amp * (1 - Math.abs(n * 2 - 1));
    norm += amp;
    amp *= 0.5; f *= 2.05;
  }
  return sum / norm;
}

// measure the raw range first, then normalise against it
const raw = new Float32Array(verts.length);
let rmin = Infinity, rmax = -Infinity;
for (let i = 0; i < verts.length; i++) {
  const v = verts[i];
  const r = ridged(v[0], v[1], v[2]);
  raw[i] = r;
  if (r < rmin) rmin = r;
  if (r > rmax) rmax = r;
}

const DEPTH = 0.21;      // how far fundi cut below the envelope
const SCALE = [0.82, 0.95, 1.22];

const positions = new Float32Array(verts.length * 3);
let maxR = 0;
for (let i = 0; i < verts.length; i++) {
  const [x, y, z] = verts[i];
  const t = (raw[i] - rmin) / (rmax - rmin);          // 1 at crown, 0 at fundus

  // smooth outer envelope, gently lumpy so it is not a perfect ball
  const lump = 1
    + 0.055 * Math.sin(x * 1.6 + 0.4)
    + 0.045 * Math.sin(y * 1.3 - 1.1)
    + 0.050 * Math.sin(z * 1.5 + 2.0);

  // carve inward only: crowns sit on the envelope, fundi cut into it
  const r = lump * (1 - DEPTH * (1 - t));

  const px = x * r * SCALE[0], py = y * r * SCALE[1], pz = z * r * SCALE[2];
  positions[i * 3] = px; positions[i * 3 + 1] = py; positions[i * 3 + 2] = pz;
  const len = Math.hypot(px, py, pz);
  if (len > maxR) maxR = len;
}

const indices = new Uint32Array(faces.length * 3);
for (let f = 0; f < faces.length; f++) {
  indices[f * 3] = faces[f][0];
  indices[f * 3 + 1] = faces[f][1];
  indices[f * 3 + 2] = faces[f][2];
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setIndex(new THREE.BufferAttribute(indices, 1));
geo.computeVertexNormals();

// ---------------------------------------------------------------------------
// scene
// ---------------------------------------------------------------------------
const host = document.getElementById('host');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
host.appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
  color: 0xa8a8a3, roughness: 0.85, metalness: 0.04, flatShading: false
}));
group.add(mesh);

scene.add(new THREE.AmbientLight(0xffffff, 0.30));
const key = new THREE.DirectionalLight(0xffffff, 0.80);
key.position.set(2.4, 2.0, 3.0);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.34);
rim.position.set(-2.6, -1.2, -2.0);
scene.add(rim);

// triangles are shown by default
const wire = new THREE.LineSegments(
  new THREE.WireframeGeometry(geo),
  new THREE.LineBasicMaterial({ color: 0x1D4ED8, transparent: true, opacity: 0.55 })
);
group.add(wire);

// ---------------------------------------------------------------------------
// camera fitting + zoom clamp
// ---------------------------------------------------------------------------
let baseDist = 3, dist = 3;
const MIN_FACTOR = 1.12;      // never let the camera reach the surface

function computeBaseDist() {
  const vFOV = camera.fov * Math.PI / 180;
  const distV = maxR / Math.tan(vFOV / 2);
  const distH = maxR / (Math.tan(vFOV / 2) * camera.aspect);
  baseDist = Math.max(distV, distH) * 1.30;   // tighter axis wins
}

function clampDist() {
  const min = Math.max(maxR * MIN_FACTOR, baseDist * 0.34);
  const max = baseDist * 2.6;
  dist = Math.min(max, Math.max(min, dist));
}

function applyCamera() {
  clampDist();
  camera.position.set(0, 0, dist);
  camera.lookAt(0, 0, 0);
}

// ---------------------------------------------------------------------------
// sizing: setSize WITHOUT the third argument, and re-check every frame plus a
// ResizeObserver, because a one-shot resize fails when the container is still
// zero-sized at load.
// ---------------------------------------------------------------------------
let curW = 0, curH = 0, started = false;
function checkSize() {
  const w = Math.floor(host.clientWidth), h = Math.floor(host.clientHeight);
  if (w > 0 && h > 0 && (w !== curW || h !== curH)) {
    curW = w; curH = h;
    renderer.setSize(w, h);            // no third argument
    camera.aspect = w / h;
    computeBaseDist();
    if (!started) { dist = baseDist; started = true; }
    camera.updateProjectionMatrix();
    applyCamera();
  }
}
new ResizeObserver(checkSize).observe(host);

// ---------------------------------------------------------------------------
// interaction: drag to rotate, silent wheel zoom, idle auto-rotation
// ---------------------------------------------------------------------------
group.rotation.set(0.18, -0.55, 0);

const IDLE_MS = 2200;
const SPIN = 0.0030;                   // radians per frame, ~35s per turn
// NB: deliberately not gated on prefers-reduced-motion. This machine has macOS
// "Reduce motion" on, which would silently disable the idle rotation entirely.
let lastTouch = -Infinity;
let dragging = false, lastX = 0, lastY = 0;

const el = renderer.domElement;
el.style.touchAction = 'none';

el.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  lastTouch = performance.now();
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!dragging) return;
  group.rotation.y += (e.clientX - lastX) * 0.007;
  group.rotation.x += (e.clientY - lastY) * 0.007;
  group.rotation.x = Math.max(-1.4, Math.min(1.4, group.rotation.x));
  lastX = e.clientX; lastY = e.clientY;
  lastTouch = performance.now();
});
el.addEventListener('pointerup', e => {
  dragging = false; lastTouch = performance.now();
  el.releasePointerCapture(e.pointerId);
});
el.addEventListener('pointercancel', () => { dragging = false; lastTouch = performance.now(); });

el.addEventListener('wheel', e => {
  e.preventDefault();
  dist *= (1 + e.deltaY * 0.0012);
  lastTouch = performance.now();
  applyCamera();
}, { passive: false });

function animate() {
  requestAnimationFrame(animate);
  checkSize();                          // every frame, not once
  if (!dragging && performance.now() - lastTouch > IDLE_MS) {
    group.rotation.y += SPIN;
  }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
