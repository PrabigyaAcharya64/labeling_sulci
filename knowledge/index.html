    .reveal {

    }

    /* Headings — serif, 44px */
    .reveal h1, .reveal h2, .reveal h3 {

      font-weight: 500;
      color: var(--ink);
      text-transform: none;
      letter-spacing: normal;
    }
    .reveal h2 { font-size: 44px; }

    /* Numbers — mono */
    .reveal .num,
    .reveal code { font-family: 'IBM Plex Mono', monospace; }

    /* Fragments: fade only, no motion */
    .reveal .fragment { transition: opacity 300ms ease-out; }

    @media (prefers-reduced-motion: reduce) {
      .reveal .fragment { transition: none; }
    }
    /* overview: let clicks select iframe slides instead of hitting the animation */
    .reveal.overview iframe { pointer-events: none; }

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.js"></script>

  <script src="../overview-carousel.js"></script>
  <script>
    Reveal.initialize({
      plugins: [ RevealMarkdown ],
      navigationMode: 'linear',
      transition: 'fade',
      transitionSpeed: 'fast',
      controls: false,
      progress: false,
      slideNumber: false,
      hash: true,
      fragments: true,
      loop: false
    });
    installOverviewCarousel(Reveal);

    Reveal.addKeyBinding({ keyCode: 40, key: '↓', description: 'Next slide' },
      () => Reveal.slide(Reveal.getIndices().h + 1, 0));
    Reveal.addKeyBinding({ keyCode: 38, key: '↑', description: 'Prev slide' },
      () => Reveal.slide(Math.max(0, Reveal.getIndices().h - 1), 0));

    // Slide iframes take keyboard focus when clicked, after which reveal.js
    // never sees the arrow keys. Each iframe forwards them here instead.
    window.addEventListener('message', e => {
      if (!e.data || e.data.type !== 'deckkey') return;
      switch (e.data.key) {
        case 'ArrowRight':
        case ' ':         Reveal.next(); break;
        case 'ArrowLeft': Reveal.prev(); break;
        case 'ArrowDown': Reveal.slide(Reveal.getIndices().h + 1, 0); break;
        case 'ArrowUp':   Reveal.slide(Math.max(0, Reveal.getIndices().h - 1), 0); break;
        case 'Escape':    Reveal.toggleOverview(); break;
        case 'o':
        case 'O':         Reveal.toggleOverview(); break;
      }
    });

    // Slides that build themselves. On arriving at one, step its fragments
    // forward on a timer. Any keypress or click hands control straight back to
    // the presenter, and leaving the slide cancels whatever is still pending.
    let autoTimer = null, autoArming = false;
    function stopAuto() { clearTimeout(autoTimer); autoTimer = null; }
    function startAuto(section) {
      stopAuto();
      if (autoArming) return;
      if (!section || !section.hasAttribute('data-autoplay')) return;
      if (!section.querySelector('.fragment')) return;
      const step = Number(section.getAttribute('data-autoplay')) || 1200;
      const i = Reveal.getIndices();
      autoArming = true;
      Reveal.slide(i.h, i.v, -1);          // rewind so the build starts empty
      autoArming = false;
      (function tick() {
        autoTimer = setTimeout(function () {
          if (Reveal.getCurrentSlide() !== section) return stopAuto();
          if (Reveal.nextFragment()) tick(); else stopAuto();
        }, step);
      })();
    }
    Reveal.on('ready', e => startAuto(e.currentSlide));
    Reveal.on('slidechanged', e => startAuto(e.currentSlide));
    ['keydown', 'mousedown'].forEach(ev =>
      document.addEventListener(ev, stopAuto, true));
  </script>
